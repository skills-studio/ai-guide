    <script>
        let levelsCompleted = 0;
        
        function completeLevel(levelNum) {
            const checkbox = document.getElementById(`check-lv${levelNum}`);
            const dashStatus = document.getElementById(`dash-status-${levelNum}`);
            const navText = document.getElementById('nav-progress-text');
            const navDots = document.getElementById('nav-progress-dots').children;
            
            if (checkbox.checked) {
                if(dashStatus) {
                    dashStatus.className = "w-3 h-3 rounded-full flex items-center justify-center text-[6px] bg-emerald-500 text-black";
                    dashStatus.innerHTML = '<i class="fa-solid fa-check"></i>';
                }
                navDots[levelNum-1].className = "h-1.5 flex-1 rounded-full bg-emerald-500 shadow-[0_0_5px_rgba(16,185,129,0.5)]";
                levelsCompleted++;
            } else {
                if(dashStatus) {
                    dashStatus.className = "w-3 h-3 rounded-full bg-blue-500 flex items-center justify-center text-[6px]";
                    dashStatus.innerHTML = '';
                }
                navDots[levelNum-1].className = "h-1.5 flex-1 rounded-full bg-slate-800 border border-slate-700";
                levelsCompleted--;
            }
            
            navText.innerText = `${levelsCompleted} / 6 ЗАВЪРШЕНИ НИВА`;
            
            if(levelsCompleted === 6) {
                document.getElementById('all-levels-complete').classList.remove('hidden');
            } else {
                document.getElementById('all-levels-complete').classList.add('hidden');
            }
        }

        function setActiveLink(clickedEl) {
            document.querySelectorAll('.sidebar-link').forEach(el => {
                el.className = "sidebar-link block py-2 px-3 text-base text-slate-400 hover:text-white hover:bg-slate-800/50 rounded transition-colors";
            });
            clickedEl.className = "sidebar-link block py-2 px-3 text-base text-white font-bold bg-slate-800/50 rounded transition-colors";
        }

        function filterTemplates(category, event) {
            document.querySelectorAll('.lib-filter-btn').forEach(btn => {
                btn.className = "lib-filter-btn px-3 py-1.5 border border-slate-700 text-slate-400 hover:text-white hover:border-blue-500 rounded transition-colors";
            });
            event.target.className = "lib-filter-btn px-3 py-1.5 bg-blue-600 text-white rounded transition-colors";

            const categories = document.querySelectorAll('.template-category');
            categories.forEach(cat => {
                if (category === 'all' || cat.getAttribute('data-category') === category) {
                    cat.style.display = 'block';
                } else {
                    cat.style.display = 'none';
                }
            });
        }

        function generatePrompt() {
            const persona = document.getElementById('p-persona').value || 'Senior Strategist';
            const context = document.getElementById('p-context').value || 'Business context';
            const task = document.getElementById('p-task').value || 'Task requirement';
            const constraints = document.getElementById('p-constraints').value || 'No constraints';
            const output = document.getElementById('p-output').value || 'Standard output';

            const formattedPrompt = `Действай като: ${persona}\n\nКонтекст: ${context}\n\nЗадача: ${task}\n\nОграничения: ${constraints}\n\nФормат на резултата: ${output}`;

            document.getElementById('outputPromptText').innerText = formattedPrompt;
            document.getElementById('promptResultBox').classList.remove('hidden');
        }

        function resetPromptStudio() {
            document.getElementById('p-persona').value = '';
            document.getElementById('p-context').value = '';
            document.getElementById('p-task').value = '';
            document.getElementById('p-constraints').value = '';
            document.getElementById('p-output').value = '';
            document.getElementById('promptResultBox').classList.add('hidden');
        }

        function copyPromptText(event) {
            const text = document.getElementById('outputPromptText').innerText;
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "КОПИРАНО ✓";
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        function saveToHistory(event) {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "ЗАПАЗЕНО ✓";
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        function sendCopilotMessage() {
            const input = document.getElementById('copilotInput');
            const windowEl = document.getElementById('copilotChatWindow');
            if(!input.value.trim()) return;

            const userText = input.value;
            windowEl.innerHTML += `<div class="text-white bg-slate-800/50 p-3 rounded-r-lg rounded-bl-lg w-max max-w-[80%] self-start ml-auto mb-2">[ ТИ ]: ${userText}</div>`;
            input.value = '';
            windowEl.scrollTop = windowEl.scrollHeight;

            setTimeout(() => {
                windowEl.innerHTML += `<div class="text-emerald-400 bg-emerald-900/10 border border-emerald-900/30 p-3 rounded-l-lg rounded-br-lg w-max max-w-[80%] mb-2">[ SYSTEM ]: Анализирам запитването ти... За постигане на оптимален резултат препоръчвам да приложиш структуриран PCTCO подход и да дефинираш ясен бизнес проблем, преди да пристъпиш към автоматизация.</div>`;
                windowEl.scrollTop = windowEl.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
